<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a4a4a"/>
    </marker>
    <marker id="arloop" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#009682"/>
    </marker>
    <marker id="arback" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#df3034"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- LEFT: receding-horizon plot                                           -->
  <!-- ===================================================================== -->
  <g>
    <text x="235" y="24" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Receding-horizon prediction</text>

    <!-- axes -->
    <g stroke="#4a4a4a" stroke-width="1.4">
      <line x1="55" y1="300" x2="470" y2="300" marker-end="url(#ar)"/>
      <line x1="55" y1="300" x2="55" y2="60" marker-end="url(#ar)"/>
    </g>
    <text x="462" y="322" font-size="13" fill="#4a4a4a">time</text>
    <text x="22" y="70" font-size="13" fill="#4a4a4a">state</text>

    <!-- now divider -->
    <line x1="235" y1="60" x2="235" y2="300" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="235" y="54" font-size="12" fill="#6a6a6a" text-anchor="middle">now (t)</text>

    <!-- past / horizon labels -->
    <text x="140" y="320" font-size="12" fill="#6a6a6a" text-anchor="middle">past</text>
    <text x="350" y="320" font-size="12" fill="#6a6a6a" text-anchor="middle">prediction horizon H</text>

    <!-- horizon bracket -->
    <path d="M235,286 L235,292 L450,292 L450,286" fill="none" stroke="#6a6a6a" stroke-width="1"/>

    <!-- reference line -->
    <line x1="235" y1="95" x2="450" y2="95" stroke="#a7a7a7" stroke-width="1.2" stroke-dasharray="2,3"/>
    <text x="448" y="109" font-size="10.5" fill="#8a8a8a" text-anchor="end">reference</text>

    <!-- past trajectory -->
    <path d="M55,250 C95,230 130,255 165,232 S205,205 235,205"
          fill="none" stroke="#4a4a4a" stroke-width="2.5"/>
    <circle cx="235" cy="205" r="4.5" fill="#4a4a4a"/>
    <text x="222" y="198" font-size="11" fill="#4a4a4a" text-anchor="end">measured</text>

    <!-- predicted trajectory -->
    <path d="M235,205 C275,165 330,120 390,103 S445,97 450,96"
          fill="none" stroke="#009682" stroke-width="2.5" stroke-dasharray="7,4"/>
    <text x="360" y="88" font-size="11" fill="#009682" text-anchor="middle">predicted trajectory</text>

    <!-- planned input bars -->
    <g fill="#4664aa" fill-opacity="0.8">
      <rect x="235" y="238" width="30" height="52"/>
      <rect x="267" y="250" width="30" height="40"/>
      <rect x="299" y="258" width="30" height="32"/>
      <rect x="331" y="263" width="30" height="27"/>
      <rect x="363" y="267" width="30" height="23"/>
      <rect x="395" y="270" width="30" height="20"/>
      <rect x="427" y="272" width="30" height="18"/>
    </g>
    <rect x="235" y="238" width="30" height="52" fill="none" stroke="#df3034" stroke-width="2"/>
    <text x="250" y="233" font-size="10.5" fill="#df3034" text-anchor="middle">apply u&#8320;</text>
    <text x="400" y="262" font-size="10.5" fill="#33497f" text-anchor="middle">planned inputs</text>

    <!-- only-first-applied note -->
    <text x="235" y="352" font-size="11" fill="#df3034" text-anchor="middle">only the first input is applied</text>
    <path d="M235,340 L235,300" stroke="#df3034" stroke-width="1" marker-end="url(#ar)" fill="none"/>
  </g>

  <!-- divider -->
  <line x1="500" y1="40" x2="500" y2="380" stroke="#dddddd" stroke-width="1.5"/>

  <!-- ===================================================================== -->
  <!-- RIGHT: cyclic MPC loop                                                 -->
  <!-- ===================================================================== -->
  <g>
    <text x="690" y="24" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">MPC control loop (repeats every step)</text>

    <!-- step boxes placed around a cycle -->
    <!-- 1. Measure state (top) -->
    <rect x="610" y="55" width="160" height="46" rx="8" fill="#e8f4f1" stroke="#009682" stroke-width="1.5"/>
    <text x="690" y="75" font-size="12.5" font-weight="bold" fill="#0b6" text-anchor="middle">1. Measure state</text>
    <text x="690" y="91" font-size="10.5" fill="#444" text-anchor="middle">get current x(t)</text>

    <!-- 2. Optimize over horizon (right) -->
    <rect x="730" y="160" width="170" height="54" rx="8" fill="#eef1f8" stroke="#4664aa" stroke-width="1.5"/>
    <text x="815" y="180" font-size="12.5" font-weight="bold" fill="#33497f" text-anchor="middle">2. Optimize inputs</text>
    <text x="815" y="195" font-size="10.5" fill="#444" text-anchor="middle">min cost over horizon H</text>
    <text x="815" y="208" font-size="10.5" fill="#444" text-anchor="middle">s.t. dynamics + constraints</text>

    <!-- 3. Apply first input (bottom) -->
    <rect x="610" y="275" width="160" height="46" rx="8" fill="#fdecec" stroke="#df3034" stroke-width="1.5"/>
    <text x="690" y="295" font-size="12.5" font-weight="bold" fill="#c0282c" text-anchor="middle">3. Apply first input</text>
    <text x="690" y="311" font-size="10.5" fill="#444" text-anchor="middle">u&#8320; to the system</text>

    <!-- 4. Shift horizon (left) -->
    <rect x="505" y="160" width="150" height="54" rx="8" fill="#f3f0f8" stroke="#7a5aa6" stroke-width="1.5"/>
    <text x="580" y="184" font-size="12.5" font-weight="bold" fill="#5a3f87" text-anchor="middle">4. Shift horizon</text>
    <text x="580" y="200" font-size="10.5" fill="#444" text-anchor="middle">t &#8592; t+1</text>

    <!-- center label -->
    <text x="700" y="183" font-size="12" font-style="italic" fill="#888" text-anchor="middle">repeat</text>
    <text x="700" y="198" font-size="12" font-style="italic" fill="#888" text-anchor="middle">every step</text>

    <!-- cyclic arrows (clockwise), teal -->
    <!-- 1 -> 2 -->
    <path d="M772,88 C835,100 820,130 817,154" fill="none" stroke="#009682" stroke-width="2.2" marker-end="url(#arloop)"/>
    <!-- 2 -> 3 -->
    <path d="M812,216 C808,250 760,268 772,282" fill="none" stroke="#009682" stroke-width="2.2" marker-end="url(#arloop)"/>
    <!-- 3 -> 4 -->
    <path d="M608,296 C545,284 562,246 578,216" fill="none" stroke="#009682" stroke-width="2.2" marker-end="url(#arloop)"/>
    <!-- 4 -> 1  (the "repeat" back-arrow, highlighted red) -->
    <path d="M585,158 C590,122 630,104 616,94" fill="none" stroke="#df3034" stroke-width="2.4" marker-end="url(#arback)"/>
  </g>

  <!-- ===================================================================== -->
  <!-- bottom: core idea sentence                                             -->
  <!-- ===================================================================== -->
  <text x="440" y="402" font-size="12.5" fill="#333" text-anchor="middle">Predict the future, optimize inputs over the horizon, apply only the first, then re-measure and repeat.</text>
</svg>